<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Recuperar Senha - Barber Agenda') }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000, #444444);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px #00000070;
            animation: fadeIn 0.6s;
        }

        .lang-picker-esqueci {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .lang-picker-esqueci a {
            text-decoration: none;
            font-size: 1.3rem;
            transition: transform 0.2s;
        }
        .lang-picker-esqueci a:hover {
            transform: scale(1.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #000;
            margin-top: 5px;
        }

        p {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        label {
            font-weight: bold;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #bbb;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: black;
            color: white;
            border: none;
            padding: 12px;
            font-size: 17px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }

        button:hover {
            background: #333;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-picker-esqueci">
            <a href="{{ url_for('mudar_idioma', codigo_idioma='pt') }}" title="Português">🇧🇷</a>
            <a href="{{ url_for('mudar_idioma', codigo_idioma='en') }}" title="English">🇺🇸</a>
            <a href="{{ url_for('mudar_idioma', codigo_idioma='es') }}" title="Español">🇪🇸</a>
        </div>

        <h2>{{ _('Recuperar Senha') }}</h2>
        <p>{{ _('Insira o seu e-mail cadastrado. Enviaremos uma nova senha temporária para a sua caixa de entrada.') }}</p>

        <form method="POST">

            <label>{{ _('Email:') }}</label>
            <input type="email" name="email" required placeholder="{{ _('Digite seu email') }}">

            <button type="submit">{{ _('Enviar Senha') }}</button>

        </form>

        <div class="link">
            <a href="{{ url_for('login') }}">{{ _('Voltar para o Login') }}</a>
        </div>
    </div>

</body>
</html>
