<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Cadastro - Barber Agenda') }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000, #444444);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px #00000070;
            animation: fadeIn 0.6s;
        }

        /* Seletor de idiomas discreto no topo do card */
        .lang-picker-cadastro {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .lang-picker-cadastro a {
            text-decoration: none;
            font-size: 1.3rem;
            transition: transform 0.2s;
        }
        .lang-picker-cadastro a:hover {
            transform: scale(1.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #000;
            margin-top: 5px;
        }

        label {
            font-weight: bold;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #bbb;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: black;
            color: white;
            border: none;
            padding: 12px;
            font-size: 17px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }

        button:hover {
            background: #333;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

        .link a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-picker-cadastro lang-picker-login">
            {% include '_lang_selector.html' %}
        </div>

        <h2>{{ _('Cadastro de Profissional') }}</h2>

        <form method="POST">

            <label>{{ _('Nome:') }}</label>
            <input type="text" name="nome" required placeholder="{{ _('Digite seu nome completo') }}">

            <label>{{ _('Email:') }}</label>
            <input type="email" name="email" required placeholder="{{ _('Digite seu email') }}">

            <label>{{ _('Senha:') }}</label>
            <input type="password" name="password" required placeholder="{{ _('Digite sua senha') }}">

            <label>{{ _('Confirmar Senha:') }}</label>
            <input type="password" name="confirmar_senha" required placeholder="{{ _('Confirme sua senha') }}">

            <button type="submit">{{ _('Cadastrar') }}</button>

        </form>

        <div class="link">
            <a href="{{ url_for('login') }}">{{ _('Já tem uma conta? Fazer Login') }}</a>
        </div>
    </div>

</body>
</html>
