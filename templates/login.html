<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login') }} — {{ _('AgendaSimples') }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='lang-switcher.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="page-login" lang="{{ current_locale }}">

    <div class="login-card">
        <div class="login-header">
            <div class="lang-picker-login">
                {% include '_lang_selector.html' %}
            </div>
            <h2>{{ _('Login do Profissional') }}</h2>
        </div>

        <div class="login-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'error' else 'danger' }}" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                {% if next_url %}
                <input type="hidden" name="next" value="{{ next_url }}">
                {% endif %}

                <label for="email">{{ _('E-mail') }}</label>
                <input type="email" id="email" name="email" required
                       placeholder="{{ _('Digite seu e-mail') }}" autocomplete="email">

                <label for="password">{{ _('Senha') }}</label>
                <input type="password" id="password" name="password" required
                       placeholder="{{ _('Digite sua senha') }}" autocomplete="current-password">

                <button type="submit">{{ _('Entrar') }}</button>
            </form>

            <div class="login-links">
                <a href="{{ url_for('esqueci_senha') }}">{{ _('Esqueci minha senha') }}</a>
            </div>
        </div>
    </div>

</body>
</html>
