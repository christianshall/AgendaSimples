<!DOCTYPE html>
<html lang="{{ session.get('lang', 'pt') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Barber Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .config-card { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }
        .btn-save { 
            background-color: #1a1a1a; 
            color: #c7a17a; 
            font-weight: 600; 
            border: none; 
        }
        .btn-save:hover { 
            background-color: #333; 
            color: #c7a17a; 
        }
        .preview-capa {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px dashed #ddd;
        }
    </style>
</head>
<body>

<div class="config-card">
    <h3 class="mb-4 text-center">⚙️ Configurações</h3>
    
    <div class="text-center">
        <label class="form-label font-weight-bold">Foto de Capa Atual:</label>
        {% if foto_capa %}
            <img src="{{ url_for('static', filename='uploads/capa/' + foto_capa) }}" class="preview-capa" alt="Capa">
        {% else %}
            <div class="preview-capa d-flex align-items-center justify-content-center text-muted bg-light">
                <span>Sem foto de capa</span>
            </div>
        {% endif %}
    </div>

    <form action="{{ url_for('admin_configuracoes') }}" method="POST" enctype="multipart/form-data">
        
        <div class="mb-3">
            <label class="form-label font-weight-bold" style="color: #1a1a1a;">Nome da Barbearia:</label>
            <input type="text" name="nome_barbearia" class="form-control" value="{{ nome_atual }}" required placeholder="Ex: Barber Shop Premium">
            <small class="text-muted">Este nome será atualizado no cabeçalho de todas as agendas.</small>
        </div>
        
        <div class="mb-4">
            <label class="form-label font-weight-bold" style="color: #1a1a1a;">Alterar Foto de Capa:</label>
            <input type="file" name="foto_capa" class="form-control" accept="image/*">
            <small class="text-muted">Selecione uma imagem do seu computador (PNG, JPG).</small>
        </div>
        
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-save btn-lg">
                <i class="fas fa-save me-2"></i>Salvar Alterações
            </button>
            <a href="{{ url_for('admin_agenda') }}" class="btn btn-outline-secondary">
                Voltar para Agenda
            </a>
        </div>
    </form>
</div>

</body>
</html>
